# Render Blueprint: creates the web app and a PostgreSQL database.
# In Render: New -> Blueprint -> pick this repo.
services:
  - type: web
    name: meridian-itsm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString

databases:
  - name: meridian-db
    plan: free
    databaseName: meridian
    user: meridian
